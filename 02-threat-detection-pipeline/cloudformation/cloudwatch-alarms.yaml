AWSTemplateFormatVersion: '2010-09-09'
Description: 'P2 - Security CloudWatch alarms - MAS TRM 10.1'
Parameters:
  AlertEmail:
    Type: String
    Default: d.arunkumar@yahoo.com

Resources:
  SecurityAlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: governance-security-alerts
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  RootLoginAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: SECURITY-root-login-detected
      AlarmDescription: 'MAS TRM 9.1 - Root account login is high-risk'
      MetricName: RootLoginCount
      Namespace: CloudTrailMetrics
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref SecurityAlertTopic
      TreatMissingData: notBreaching

  IAMPolicyChangeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: SECURITY-iam-policy-change-detected
      MetricName: IAMPolicyChanges
      Namespace: CloudTrailMetrics
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref SecurityAlertTopic
      TreatMissingData: notBreaching

  S3PolicyChangeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: SECURITY-s3-bucket-policy-change
      MetricName: S3BucketPolicyChanges
      Namespace: CloudTrailMetrics
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref SecurityAlertTopic
      TreatMissingData: notBreaching
