AWSTemplateFormatVersion: '2010-09-09'
Description: 'P1 - AWS Config governance rules - MAS TRM aligned'

Resources:
  RootMFARule:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: mas-trm-root-mfa-enabled
      Description: 'MAS TRM 9.1.1 - Root account MFA must be enabled'
      Source:
        Owner: AWS
        SourceIdentifier: ROOT_ACCOUNT_MFA_ENABLED

  CloudTrailEnabledRule:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: mas-trm-cloudtrail-enabled
      Description: 'MAS TRM 11.2 - CloudTrail must be enabled'
      Source:
        Owner: AWS
        SourceIdentifier: CLOUD_TRAIL_ENABLED

  NoPublicS3Rule:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: mas-trm-s3-no-public-access
      Description: 'MAS TRM 11.2 - S3 buckets must block public access'
      Source:
        Owner: AWS
        SourceIdentifier: S3_BUCKET_LEVEL_PUBLIC_ACCESS_PROHIBITED

  KMSRotationRule:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: mas-trm-kms-key-rotation
      Description: 'MAS TRM 9.1.2 - KMS keys must be rotated annually'
      Source:
        Owner: AWS
        SourceIdentifier: CMK_BACKING_KEY_ROTATION_ENABLED

  UnusedKeyRule:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: mas-trm-iam-no-unused-keys
      Description: 'MAS TRM 9.1.3 - IAM access keys must be rotated'
      Source:
        Owner: AWS
        SourceIdentifier: ACCESS_KEYS_ROTATED
      InputParameters:
        maxAccessKeyAge: '90'

  S3EncryptionRule:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: mas-trm-s3-encryption-enabled
      Description: 'MAS TRM 11.2 - S3 buckets must use SSE-KMS'
      Source:
        Owner: AWS
        SourceIdentifier: S3_BUCKET_SERVER_SIDE_ENCRYPTION_ENABLED