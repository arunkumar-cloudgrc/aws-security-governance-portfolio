AWSTemplateFormatVersion: '2010-09-09'
Description: 'P1 - IAM Roles with Permission Boundaries - MAS TRM Ch.9'

Resources:
  # Permission boundary - caps maximum permissions for all custom roles
  PermissionBoundaryPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: GovernancePermissionBoundary
      Description: 'Maximum permissions ceiling - MAS TRM 9.1.2'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:ListBucket
              - cloudwatch:GetMetricData
              - cloudwatch:ListMetrics
              - logs:GetLogEvents
              - logs:DescribeLogGroups
            Resource: '*'

  # Auditor role - read-only, for compliance and audit team
  AuditorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: GovernanceAuditorRole
      Description: 'Read-only auditor role - MAS TRM 9.3 Privileged Access'
      PermissionsBoundary: !Ref PermissionBoundaryPolicy
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/SecurityAudit
        - arn:aws:iam::aws:policy/ReadOnlyAccess

  # Security operations role - GuardDuty and Config read access
  SecurityOpsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: GovernanceSecurityOpsRole
      Description: 'Security operations role - detection and response'
      PermissionsBoundary: !Ref PermissionBoundaryPolicy
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonGuardDutyReadOnlyAccess
        - arn:aws:iam::aws:policy/AWSConfigUserAccess